<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spresso Kit – ديمو البوت</title>
<style>
  :root{--bg:#efeae2;--head:#0b3d2e;--out:#d9fdd3;--in:#fff;--ink:#111b21;--mute:#667781;--gold:#c8962e}
  @media (prefers-color-scheme:dark){:root{--bg:#0b141a;--out:#005c4b;--in:#202c33;--ink:#e9edef;--mute:#8696a0}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin-inline:auto}
  header{background:var(--head);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .av{width:40px;height:40px;border-radius:50%;background:#f6f1e7;color:var(--head);display:grid;place-items:center;font-weight:700}
  header b{display:block;font-size:16px} header small{opacity:.8;font-size:12px}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:82%;padding:8px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.5;font-size:15px;box-shadow:0 1px 1px rgba(0,0,0,.12)}
  .in{background:var(--in);align-self:flex-start}
  .out{background:var(--out);align-self:flex-end}
  .note{align-self:center;background:#fff3c4;color:#5b4a00;font-size:12px;padding:6px 10px;border-radius:8px;max-width:90%;text-align:center}
  @media (prefers-color-scheme:dark){.note{background:#3a3320;color:#f0dd9a}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 8px}
  .chips button{border:1px solid var(--gold);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
  form{display:flex;gap:8px;padding:10px 12px;background:var(--bg);border-top:1px solid rgba(0,0,0,.08)}
  input{flex:1;padding:12px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.15);font:inherit;font-size:16px;background:var(--in);color:var(--ink)}
  form button{width:46px;height:46px;border-radius:50%;border:0;background:var(--head);color:#fff;font-size:18px;cursor:pointer}
  .foot{text-align:center;font-size:11px;color:var(--mute);padding:0 0 8px}
</style>
</head>
<body>
<header><div class="av">S</div><div><b>Spresso Kit</b><small>ديمو ديال البوت · Botak</small></div></header>
<div id="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="كتب رسالتك..." aria-label="رسالة"><button aria-label="إرسال">➤</button></form>
<div class="foot">هادي تجربة. الطلبات ما كتوصلش لصاحب المحل.</div>
<script>
const log=document.getElementById('log'),f=document.getElementById('f'),t=document.getElementById('t'),chips=document.getElementById('chips');
let sid;try{sid=localStorage.getItem('sid')}catch(e){}
if(!sid){sid=Math.random().toString(36).slice(2,12);try{localStorage.setItem('sid',sid)}catch(e){}}
function add(txt,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight}
function note(txt){const d=document.createElement('div');d.className='note';d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight}
async function send(txt){
  if(!txt.trim())return;
  add(txt,'out');t.value='';
  try{
    const r=await fetch('/demo/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid,text:txt})});
    const j=await r.json();
    (j.replies||[]).forEach(x=>add(x,'in'));
    if(j.notified)note('📩 صاحب المحل غيتوصل بهاد الطلب فواتساب (فالتجربة ما كيتصيفطش).');
  }catch(e){note('وقع مشكل فالاتصال، عاود.')}
}
f.addEventListener('submit',e=>{e.preventDefault();send(t.value)});
['سلام','شحال ثمن بومبة 530؟','Bonjour, avez-vous un panier filtre ?','بغيت نطلب'].forEach(s=>{
  const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>send(s);chips.appendChild(b)});
send('سلام');
</script>
</body>
</html>
